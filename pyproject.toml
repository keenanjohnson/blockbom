[project]
name = "blockbom"
version = "0.3.0"
description = "Design block-diagram + BOM combos for hardware prototypes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Keenan Johnson", email = "keenan.johnson@gmail.com" }
]
keywords = ["mermaid", "bom", "flowchart", "diagram", "bill-of-materials"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "ruamel.yaml>=0.18",
    "openpyxl>=3.1",
]

[project.scripts]
blockbom = "blockbom.cli:main"

[project.urls]
Homepage = "https://github.com/keenanjohnson/blockbom"
Repository = "https://github.com/keenanjohnson/blockbom"
Issues = "https://github.com/keenanjohnson/blockbom/issues"

[project.optional-dependencies]
edit = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
    "types-openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The editor frontend is a build product (gitignored) that must ship anyway.
artifacts = ["src/blockbom/_static/"]

[tool.hatch.build.targets.wheel]
packages = ["src/blockbom"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
